# NyxOS settings. KEY=value, one per line. Real environment variables win over this file.
# Per-user override: ~/.config/nyx/nyx.conf
#
# Cloud model (best answers, needs internet):
#ANTHROPIC_API_KEY=sk-ant-...
#
# Local / OpenAI-compatible model (works offline). `nyx` falls back to this when the cloud is unreachable.
#NYX_LOCAL_URL=http://127.0.0.1:8080/v1
#NYX_LOCAL_MODEL=local
#
# auto (default) = cloud if a key is set, else local | cloud | local
#NYX_BACKEND=auto
