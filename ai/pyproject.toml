[project]
name = "nyx"
version = "0.1.0"
description = "NyxOS AI shell helper"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
nyx = "nyx.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
